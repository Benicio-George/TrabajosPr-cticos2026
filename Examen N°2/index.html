<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen JavaScript</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!--Ejercicio 1-->
    <div class="container">
        <h1>1) Termómetro digital</h1>
        <div class="datos">
            <!--Datos de usuario-->
            <input type="number" name="temp" id="input1"
                placeholder="Ingresa la temperatura en grados. Ejemplo: 32">
        </div>

        <div class="resultados">
            <!--Boton para verificar el resultado-->
            <button id="boton1">Verificar temperatura</button>

            <!--Texto para mostrar el resultado-->
            <h3 id="parrafo1">Cargando resultado...</h3>
        </div>
    </div>


    <!--Ejercicio 2-->
    <div class="container">
        <h1>2) Clasificador de basura</h1>
        <div class="datos">
            <!--Datos de usuario-->
            <input type="text" name="dias" id="input2"
                placeholder="¿Es orgánico o no orgánico?">
        </div>

        <div class="resultados">
            <!--Boton para verificar el resultado-->
            <button id="boton2">Verificar basura</button>

            <!--Texto para mostrar el resultado-->
            <h3 id="parrafo2">Cargando resultado...</h3>
        </div>
    </div>


    <!--Ejercicio 3-->
    <div class="container">
        <h1>3) Iniciar sesion</h1>

        <div class="datos-3">
            <!--Datos de usuario: usuario-->
            <input type="text" name="usuario" id="input3"
                placeholder="Ingresa el usuario">

            <!--Datos de usuario: contraseña-->
            <input type="password" name="contrasena" id="input4"
                placeholder="Ingresar contraseña">
        </div>

        <div class="resultados">
            <!--Boton para verificar el resultado-->
            <button id="boton3">Iniciar sesión</button>

            <!--Texto para mostrar el resultado-->
            <h3 id="parrafo3">Cargando resultado...</h3>
        </div>
    </div>


    <!--Ejercicio 4-->
    <div class="container">
        <h1>4) Asistencia alumno</h1>

        <div class="datos">
            <!--Datos de usuario-->
            <input type="text" name="nombre" id="input5"
                placeholder="Ingresa el nombre">
        </div>

        <div class="resultados">
            <!--Boton para verificar el resultado-->
            <button id="boton4">Verificar asistencia</button>

            <!--Texto para mostrar el resultado-->
            <h3 id="parrafo4">Cargando resultado...</h3>
        </div>
    </div>


</body>

<script src="app.js"></script>

</html>
